<!doctype html>
<html>
  <head>
    <style>
      :root{font-family:Inter,Arial,sans-serif;color:#20202b;background:#fff}*{box-sizing:border-box}body{margin:0;padding:22px}.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700}.mark{width:19px;height:19px;background:linear-gradient(135deg,#6959e7 50%,#ea7daa 50%);border-radius:5px;transform:rotate(45deg)}p{color:#83838e;font-size:11px;line-height:1.5;margin:14px 0 20px}textarea{display:block;width:100%;height:128px;resize:none;border:1px solid #dedde8;border-radius:8px;padding:12px;outline:none;font:12px/1.5 Inter,Arial;color:#20202b}textarea:focus{border-color:#6c5ce8}.tools{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.attach{color:#6657dc;font-size:11px;cursor:pointer}.files{font-size:10px;color:#83838e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}.button{width:100%;border:0;border-radius:8px;background:#6857e7;color:#fff;padding:12px;margin-top:14px;font-weight:700;cursor:pointer}.button:disabled{opacity:.6}.status{display:none;border-radius:8px;background:#f2f1ff;color:#6556dc;padding:11px;font-size:11px;line-height:1.5;margin-top:14px}.status.show{display:block}.success{background:#edfaf4;color:#279369}.error{background:#fff0f2;color:#c75b72}
    </style>
  </head>
  <body>
    <div class="brand"><span class="mark"></span><span>canvas.ai</span></div>
    <p>Опишите, что создать или изменить. Результат появится на текущей странице Figma.</p>
    <textarea id="prompt" placeholder="Например: создай экран профиля приложения..."></textarea>
    <div class="tools"><label class="attach">＋ Прикрепить скриншот<input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden /></label><span class="files" id="files"></span></div>
    <button class="button" id="generate">Создать в Figma</button>
    <div class="status" id="status"></div>
    <script>
      const endpoint = "https://canvas-ai-worker.mk99anik.workers.dev";
      const prompt = document.getElementById("prompt");
      const imagesInput = document.getElementById("images");
      const filesLabel = document.getElementById("files");
      const button = document.getElementById("generate");
      const status = document.getElementById("status");
      let images = [];
      const show = (message, kind = "") => { status.textContent = message; status.className = `status show ${kind}`; };
      const readImage = (file) => new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve({ name: file.name, type: file.type, data: reader.result }); reader.onerror = reject; reader.readAsDataURL(file); });
      imagesInput.onchange = async () => { const files = Array.from(imagesInput.files || []).filter((file) => file.size <= 5 * 1024 * 1024).slice(0, 3); images = await Promise.all(files.map(readImage)); filesLabel.textContent = images.map((image) => image.name).join(", "); };
      button.onclick = async () => {
        const text = prompt.value.trim();
        if (!text) { show("Сначала напишите промт", "error"); return; }
        button.disabled = true;
        show("AI создаёт макет…");
        try {
          const response = await fetch(`${endpoint}/api/generate`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: text, images }) });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Не удалось создать дизайн");
          parent.postMessage({ pluginMessage: { type: "create-design", design: data.design, prompt: text } }, "*");
          show("Создаём редактируемые слои в текущем файле…");
        } catch (error) {
          button.disabled = false;
          show(error.message, "error");
        }
      };
      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "created") { show("Готово — макет добавлен в Figma.", "success"); button.disabled = false; }
        if (message.type === "edited") { show("Готово — выбранный слой изменён.", "success"); button.disabled = false; }
        if (message.type === "failed") { show(message.error, "error"); button.disabled = false; }
      };
    </script>
  </body>
</html>
